# @package _global_
# to execute this experiment run:
# python train.py experiment=example
defaults:
  - override /data: im2im/segmentation.yaml
  - override /model: im2im/segmentation.yaml
  - override /callbacks: default.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml
    #- override /logger: mlflow.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["dev"]
seed: 12345

experiment_name: megaseg_DSP
run_name: dynUNet_base_DSP
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000

data:
  path: {paths.data_dir}/DSP
  cache_dir: {paths.data_dir}/DSP/cache/
  subsample:
  batch_size: 32
  _aux:
    # 2D
    # patch_shape: [64, 64]
    # 3D
    patch_shape: [32, 128, 128]
