log_dir: ${paths.root_dir}/outputs
checkpoint_dir: ${paths.root_dir}/checkpoints
cache_dir: ${paths.root_dir}/cache
output_dir: ${hydra:runtime.output_dir}
work_dir: ${hydra:runtime.cwd}
