# @package _global_
#
# Strategy C: Reinitialize all deep layers (bottleneck + enc2 + dec0 + dec1)
# --------------------------------------------------------------------------
# All layers with dead channels are reinitialized:
#   - bottleneck: 100% dead (960/960 channels)
#   - downsamples.2 (enc2): ~6-9% dead
#   - upsamples.0 (dec0): ~66% dead
#   - upsamples.1 (dec1): ~33% dead
# Shallow layers (input_block, downsamples.0, downsamples.1) are preserved.
#
# Control: FT 100% converged = Dice 0.958, Hausdorff-95 0.20
# Hypothesis: Full deep reinit creates a coherent fresh deep path while
# retaining pretrained shallow feature extraction.

defaults:
  - override /data: local/segmentation_finetune.yaml
  - override /model: local/segmentation_ms25_float32.yaml
  - override /callbacks: default.yaml
  - override /trainer: ddp.yaml
  - override /logger: csv.yaml

persist_cache: true

tags: ["surgery", "strategy_c", "reinit_deep", "lmnb1"]
seed: 12345
test: false

channel_name: EGFP

checkpoint:
  ckpt_path: /allen/aics/assay-dev/users/Suraj/megaSeg/Amil/cyto-dl/logs/train/runs/megaseg_b64_deep_new_13-STRUCTS/dynUNet_st6_base_cytodl/2024-07-15_00-39-47/checkpoints/epoch_650.ckpt
  weights_only: true
  strict: true

experiment_name: lmnb1_surgery_c_50ep
run_name: lmnb1_surgery_c_reinit_deep

source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 50
  devices: [0]

callbacks:
  layer_reinit:
    _target_: cyto_dl.callbacks.LayerReinit
    modules: backbone
    layers: ["downsamples.2", bottleneck, "upsamples.0", "upsamples.1"]
    freeze_others: false
    init_method: kaiming_normal

data:
  path: /allen/aics/rep_learn/MegaSeg/data/variance-100x/LMNB1/local/
  cache_dir: /allen/aics/rep_learn/MegaSeg/benchmark/cache/tmpi4tkztph
  subsample:
  batch_size: 16
  num_workers: 4
  _aux:
    patch_shape: [32, 128, 128]
