# @package _global_
#
# Strategy D: Freeze shallow + reinitialize deep
# ------------------------------------------------
# Most aggressive surgery: freeze all healthy shallow layers (input_block,
# downsamples.0, downsamples.1) and reinitialize all damaged deep layers
# (downsamples.2, bottleneck, upsamples.0, upsamples.1).
# The output_block and upsamples.2/3 are also frozen since they connect
# to healthy skip connections.
#
# This forces the model to learn new deep representations without
# disturbing the pretrained shallow features that drive performance.
#
# Control: FT 100% converged = Dice 0.958, Hausdorff-95 0.20
# Hypothesis: Focused learning budget on the collapsed layers yields
# faster convergence and potentially better deep representations.

defaults:
  - override /data: local/segmentation_finetune.yaml
  - override /model: local/segmentation_ms25_float32.yaml
  - override /callbacks: default.yaml
  - override /trainer: ddp.yaml
  - override /logger: csv.yaml

persist_cache: true

tags: ["surgery", "strategy_d", "freeze_shallow_reinit_deep", "lmnb1"]
seed: 12345
test: false

channel_name: EGFP

checkpoint:
  ckpt_path: /allen/aics/assay-dev/users/Suraj/megaSeg/Amil/cyto-dl/logs/train/runs/megaseg_b64_deep_new_13-STRUCTS/dynUNet_st6_base_cytodl/2024-07-15_00-39-47/checkpoints/epoch_650.ckpt
  weights_only: true
  strict: true

experiment_name: lmnb1_surgery_d_50ep
run_name: lmnb1_surgery_d_freeze_shallow

source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 50
  devices: [0]

callbacks:
  layer_reinit:
    _target_: cyto_dl.callbacks.LayerReinit
    modules: backbone
    layers: ["downsamples.2", bottleneck, "upsamples.0", "upsamples.1"]
    freeze_others: true
    init_method: kaiming_normal

data:
  path: /allen/aics/rep_learn/MegaSeg/data/variance-100x/LMNB1/local/
  cache_dir: /allen/aics/rep_learn/MegaSeg/benchmark/cache/tmpi4tkztph
  subsample:
  batch_size: 16
  num_workers: 4
  _aux:
    patch_shape: [32, 128, 128]
