# @package _global_
defaults:
  - override /data: local/segmentation_finetune.yaml
  - override /model: local/segmentation_ms25_float32.yaml
  - override /callbacks: eval.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["scratch", "lamp1", "data10_converged"]
seed: 12345

channel_name: null

checkpoint:
  # Populate this stable handoff checkpoint after training by copying or
  # symlinking the selected run checkpoint into checkpoint_dir/scratch/lamp1/.
  ckpt_path: /allen/aics/rep_learn/MegaSeg/benchmark/outputs/train/scratch/lamp1/lamp1_scratch_data10_converged/checkpoints/last.ckpt
  weights_only: null
  strict: true

experiment_name: lamp1_scratch_data10_converged
run_name: dynunet_lamp1_data10_converged
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/scratch/lamp1/data10_converged

paths:
  output_dir: ${paths.log_dir}/eval/scratch/lamp1/data10_converged

data:
  path: /allen/aics/rep_learn/MegaSeg/data/variance-100x/LAMP1/local/test/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/scratch/lamp1/data10_converged
    stages: ["test", "predict"]
