# @package _global_
defaults:
  - override /data: local/segmentation_finetune.yaml
  - override /model: local/segmentation_ms25_float32.yaml
  - override /callbacks: eval.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["finetune", "lmnb1", "data10_10epochs"]
seed: 12345

channel_name: EGFP

checkpoint:
  ckpt_path: ${paths.root_dir}/outputs/train/runs/lmnb1_data10_10epochs/lmnb1_ft_data10_10epochs/2026-03-02_10-34-45/checkpoints/epoch_009.ckpt
  weights_only: null
  strict: true

experiment_name: finetune_lmnb1_data10_10epochs
run_name: dynunet_lmnb1_data10_10epochs
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/finetune/lmnb1/data10_10epochs

paths:
  output_dir: ${paths.log_dir}/eval/finetune/lmnb1/data10_10epochs

data:
  path: ${paths.data_dir}/variance-100x/LMNB1/local/test/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/finetune/lmnb1/data10_10epochs
    stages: ["test", "predict"]
