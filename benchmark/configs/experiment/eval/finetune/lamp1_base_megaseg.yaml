# @package _global_
defaults:
  - override /data: local/segmentation_finetune.yaml
  - override /model: local/segmentation_ms25_float32.yaml
  - override /callbacks: eval.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["baseline", "lamp1", "base_megaseg"]
seed: 12345

channel_name: EGFP

checkpoint:
  ckpt_path: /allen/aics/assay-dev/users/Suraj/megaSeg/Amil/cyto-dl/logs/train/runs/megaseg_b64_deep_new_13-STRUCTS/dynUNet_st6_base_cytodl/2024-07-15_00-39-47/checkpoints/epoch_650.ckpt
  weights_only: null
  strict: true

experiment_name: baseline_lamp1_base_megaseg
run_name: dynunet_lamp1_base_megaseg
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/finetune/lamp1/base_megaseg

paths:
  output_dir: ${paths.log_dir}/eval/finetune/lamp1/base_megaseg

data:
  path: ${paths.data_dir}/variance-100x/LAMP1/local/test/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/finetune/lamp1/base_megaseg
    stages: ["test", "predict"]
