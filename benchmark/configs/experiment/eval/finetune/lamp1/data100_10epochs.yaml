# @package _global_
defaults:
  - override /data: local/segmentation_finetune.yaml
  - override /model: local/segmentation_ms25_float32.yaml
  - override /callbacks: eval.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["finetune", "lamp1", "data100_10epochs"]
seed: 12345

channel_name: null

checkpoint:
  ckpt_path: ${paths.root_dir}/outputs/train/runs/lamp1_data100_10epochs/lamp1_ft_data100_10epochs/2026-04-09_07-30-36/checkpoints/epoch_008.ckpt
  weights_only: null
  strict: true

experiment_name: finetune_lamp1_data100_10epochs
run_name: dynunet_lamp1_data100_10epochs
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/finetune/lamp1/data100_10epochs

paths:
  output_dir: ${paths.log_dir}/eval/finetune/lamp1/data100_10epochs

data:
  path: /allen/aics/rep_learn/MegaSeg/data/variance-100x/LAMP1/local/test/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/finetune/lamp1/data100_10epochs
    stages: ["test", "predict"]
