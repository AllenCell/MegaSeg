# @package _global_
# Eval: ablation 7_structs model tested on AAVS1
defaults:
  - override /data: local/segmentation_finetune.yaml
  - override /model: local/segmentation_ms25_float32.yaml
  - override /callbacks: eval.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["ablation_eval", "7_structs"]
seed: 12345

channel_name: "C:0"

checkpoint:
  ckpt_path: /allen/aics/rep_learn/MegaSeg/benchmark/outputs/train/runs/ablation_7_structs/dynunet_7structs_scratch/2026-03-06_00-14-12/checkpoints/epoch_683.ckpt
  weights_only: true
  strict: true

experiment_name: ablation_eval_7_structs_AAVS1
run_name: dynunet_7_structs_AAVS1
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/ablation/7_structs/AAVS1

paths:
  output_dir: ${paths.log_dir}/eval/ablation/7_structs/AAVS1

data:
  path: ${paths.data_dir}/variance-100x/AAVS1/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/ablation/7_structs/AAVS1
    stages: ["test", "predict"]
