# @package _global_
defaults:
  - override /data: local/segmentation.yaml
  - override /model: local/segmentation_ms25_uint8.yaml
  - override /callbacks: eval.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["individual_eval", "uint8"]
seed: 12345

checkpoint:
  ckpt_path: ${paths.checkpoint_dir}/individual/ST6GAL1.ckpt

experiment_name: individual_eval_ST6GAL1
run_name: dynUNet_ST6GAL1
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/uint8/individual/ms13-ST6GAL1

paths:
  output_dir: ${paths.log_dir}/eval/uint8/individual/ms13-ST6GAL1

data:
  path: ${paths.data_dir}/variance-100x/ST6GAL1/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/uint8/individual/ms13-ST6GAL1
    stages: ["test", "predict"]
