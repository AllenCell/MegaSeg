# @package _global_
defaults:
  - override /data: local/segmentation_s3.yaml
  - override /model: local/segmentation_ms25_uint8.yaml
  - override /callbacks: default.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["megaseg_eval", "uint8", "drug_perturbation"]
seed: 12345

checkpoint:
  ckpt_path: ${paths.checkpoint_dir}/megaseg/dynunet.ckpt

train: False
test: False
predict: True

experiment_name: megaseg_eval_drug_perturbation_NUP153
run_name: dynunet_megaseg_drug_NUP153
source_col: file_path
target_col: split
raw_channel: 1

spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/uint8/megaseg/dynunet/drug_perturbation/NUP153

paths:
  output_dir: ${paths.log_dir}/eval/uint8/megaseg/dynunet/drug_perturbation/NUP153

data:
  path: ${paths.root_dir}/data/drug_perturbations/eval_csvs/NUP153.csv
  split_column: split
  just_inference: True
  subsample:
  batch_size: 1
  num_workers: 4
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  rich_progress_bar: null
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/uint8/megaseg/dynunet/drug_perturbation/NUP153
    stages: ["predict"]
