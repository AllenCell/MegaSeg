# @package _global_
defaults:
  - override /data: local/segmentation.yaml
  - override /model: local/segmentation_ms25_float32.yaml
  - override /callbacks: eval.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["megaseg_eval", "float32"]
seed: 12345

checkpoint:
  ckpt_path: ${paths.checkpoint_dir}/megaseg/dynunet.ckpt

experiment_name: megaseg_eval_dynunet_TOMM20
run_name: dynunet_megaseg_TOMM20
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/float32/megaseg/dynunet/TOMM20

paths:
  output_dir: ${paths.log_dir}/eval/float32/megaseg/dynunet/TOMM20

data:
  path: ${paths.data_dir}/variance-100x/TOMM20/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/float32/megaseg/dynunet/TOMM20
    stages: ["test", "predict"]
