# @package _global_
defaults:
  - override /data: local/segmentation.yaml
  - override /model: local/segmentation_ms25_attn_unet_float32.yaml
  - override /callbacks: default.yaml
  - override /trainer: ddp.yaml
  - override /logger: csv.yaml

tags: ["megaseg_eval", "float32"]
seed: 12345

checkpoint:
  ckpt_path: ${paths.checkpoint_dir}/megaseg/attention_unet.ckpt

experiment_name: megaseg_eval_attention_unet_NPM1
run_name: attention_unet_megaseg_NPM1
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/float32/megaseg/attention_unet/NPM1

paths:
  output_dir: ${paths.log_dir}/eval/float32/megaseg/attention_unet/NPM1

data:
  path: ${paths.data_dir}/variance-100x/NPM1/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/float32/megaseg/attention_unet/NPM1
    stages: ["test", "predict"]
