# @package _global_
defaults:
  - override /data: local/segmentation.yaml
  - override /model: local/segmentation_ms25_swin_unetr_float32.yaml
  - override /callbacks: eval.yaml
  - override /trainer: ddp.yaml
  - override /logger: csv.yaml

tags: ["megaseg_eval", "float32"]
seed: 12345

checkpoint:
  ckpt_path: ${paths.checkpoint_dir}/megaseg/swin_unetr.ckpt

experiment_name: megaseg_eval_swin_unetr_NUP153
run_name: swin_unetr_megaseg_NUP153
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/float32/megaseg/swin_unetr/NUP153

paths:
  output_dir: ${paths.log_dir}/eval/float32/megaseg/swin_unetr/NUP153

data:
  path: ${paths.data_dir}/variance-100x/NUP153/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/float32/megaseg/swin_unetr/NUP153
    stages: ["test", "predict"]
