# @package _global_
defaults:
  - override /data: local/segmentation.yaml
  - override /model: local/segmentation_ms25_float32.yaml
  - override /callbacks: default.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["individual_eval", "float32"]
seed: 12345

checkpoint:
  ckpt_path: ${paths.checkpoint_dir}/individual/ATP2A2.ckpt

experiment_name: individual_eval_ATP2A2
run_name: dynUNet_ATP2A2
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 1000
  devices: [0]

model:
  save_dir: ${paths.log_dir}/eval/float32/individual/ms13-ATP2A2

paths:
  output_dir: ${paths.log_dir}/eval/float32/individual/ms13-ATP2A2

data:
  path: ${paths.data_dir}/variance-100x/ATP2A2/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/eval/float32/individual/ms13-ATP2A2
    stages: ["test", "predict"]
