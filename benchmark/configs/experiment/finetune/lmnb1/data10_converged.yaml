# @package _global_
# Fine-tuned LMNB1 predict config: data10_converged
# Run with: CYTODL_CONFIG_PATH=configs uv run python cyto-dl/cyto_dl/eval.py \
#           experiment=finetune/lmnb1/data10_converged
defaults:
  - override /data: local/segmentation.yaml
  - override /model: local/segmentation_ms25_uint8.yaml
  - override /callbacks: eval.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["finetune", "lmnb1", "predict", "data10"]
seed: 12345

checkpoint:
  ckpt_path: ${paths.checkpoint_dir}/finetune/lmnb1/lmnb1_data10_converged.ckpt

experiment_name: finetune_lmnb1_data10_converged
run_name: dynunet_lmnb1_data10_converged_predict
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  devices: [0]

model:
  save_dir: ${paths.log_dir}/finetune/lmnb1/data10_converged

paths:
  output_dir: ${paths.log_dir}/finetune/lmnb1/data10_converged

data:
  path: ${paths.root_dir}/data/lmnb1/test/
  cache_dir: ${paths.cache_dir}
  subsample:
  batch_size: 1
  num_workers: 1
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/finetune/lmnb1/data10_converged
    stages: ["test", "predict"]
