# @package _global_
defaults:
  - override /data: local/segmentation.yaml
  - override /model: local/segmentation_ms25_uint8.yaml
  - override /callbacks: eval.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

tags: ["finetune", "lmnb1", "data20"]
seed: 42

train: True
test: True

checkpoint:
  ckpt_path: ${paths.checkpoint_dir}/megaseg/dynunet.ckpt
  weights_only: True
  strict: True

experiment_name: finetune_lmnb1_data20_epochs10
run_name: dynunet_lmnb1_data20_epochs10
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1

trainer:
  max_epochs: 10
  devices: [0]

model:
  save_dir: ${paths.log_dir}/finetune/lmnb1/data20_epochs10

paths:
  output_dir: ${paths.log_dir}/finetune/lmnb1/data20_epochs10

data:
  path: ${paths.root_dir}/data/lmnb1/
  cache_dir: ${paths.cache_dir}
  subsample:
    train: 32
  batch_size: 1
  num_workers: 4
  _aux:
    patch_shape: [32, 128, 128]

callbacks:
  early_stopping:
    patience: 1000
  saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${paths.log_dir}/finetune/lmnb1/data20_epochs10
    stages: ["test"]
